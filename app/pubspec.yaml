name: csit_app
description: تطبيق كلية علوم الحاسوب وتكنولوجيا المعلومات – جامعة القادسية
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # State / routing
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.2

  # Network
  dio: ^5.7.0

  # Storage
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.2

  # QR
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0

  # Notifications
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Device / location
  device_info_plus: ^11.2.0
  geolocator: ^13.0.2

  # Files
  pdfx: ^2.6.0
  file_picker: ^8.1.6

  # Codegen / models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Misc
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.3
  custom_lint: ^0.6.8
  riverpod_lint: ^2.6.3
  drift_dev: ^2.21.0

flutter:
  uses-material-design: true
  generate: true   # generates l10n from lib/l10n/*.arb

  assets:
    - assets/fonts/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
