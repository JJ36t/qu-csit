# ─────────────────────────────────────────────────────────────
# QU-CSIT — Docker Compose (dev/staging/prod)
# One command: `docker compose up`
# All services movable to a university server later.
# ─────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: csit
      POSTGRES_USER: csit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-csit}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csit -d csit"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"   # only expose locally for dev

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: ./api
    restart: unless-stopped
    env_file:
      - ./api/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://csit:${POSTGRES_PASSWORD:-csit}@postgres:5432/csit
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api:/app                # hot reload in dev
      - api_storage:/app/storage
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: ./api
    restart: unless-stopped
    command: ["arq", "app.worker.WorkerSettings"]
    env_file:
      - ./api/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://csit:${POSTGRES_PASSWORD:-csit}@postgres:5432/csit
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  admin:
    build: ./admin
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api

volumes:
  pg_data:
  redis_data:
  api_storage:
  caddy_data:
  caddy_config:
