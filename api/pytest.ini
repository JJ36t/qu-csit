[pytest]
testpaths = tests
asyncio_mode = auto
addopts = -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:pydantic.*

[coverage:run]
source = app
branch = True

[coverage:report]
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
