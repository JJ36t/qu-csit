name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  api:
    name: API (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install ruff pytest-cov
      - run: ruff check .
      - run: ruff format --check .
        continue-on-error: true   # formatting is advisory in CI for now
      - run: pytest -q
        env:
          APP_ENV: test
          DATABASE_URL: "sqlite:///./test.db"
          JWT_SECRET: "ci-test-secret-do-not-use-in-prod"
          REDIS_URL: ""
          # Bypass the dev-only .env override so these env vars actually win
          DOTENV_FORCE: ""

  admin:
    name: Admin (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
        continue-on-error: true   # eslint config needs tuning, advisory for now
      - run: npm run build

  flutter:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    continue-on-error: true   # Flutter SDK needs `flutter create` first; advisory
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - name: Create platform folders (if missing)
        run: |
          if [ ! -d "android" ]; then
            flutter create --org iq.edu.qu.csit --platforms=android,ios .
          fi
      - run: flutter pub get
      - name: Generate codegen (freezed/json/drift)
        run: dart run build_runner build --delete-conflicting-outputs
        continue-on-error: true   # may fail until all model files are in place
      - run: flutter analyze
        continue-on-error: true
      - run: flutter test
        continue-on-error: true
